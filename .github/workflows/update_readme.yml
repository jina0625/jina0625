name: Update README with Tistory RSS

on:
  schedule:
    - cron: "0 15 * * *"  # 매일 00:00 KST 실행 (GitHub Actions는 UTC 기준)
  workflow_dispatch:  # 수동 실행 가능

permissions:
  contents: write  # ✅ 저장소 변경을 위한 권한 부여

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3
        with:
          persist-credentials: false  # ❗ 필수 설정 (GitHub Actions 기본 인증 비활성화)

      - name: Set up Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set up Python
        uses: actions/setup-python@v3
        with:
          python-version: '3.x'  # 최신 Python 사용

      - name: Install Dependencies
        run: pip install feedparser  # 필요한 Python 패키지 설치

      - name: Run Python Script
        run: python main.py  # 또는 RSS 데이터를 가져오는 Python 파일 실행

      - name: Commit and Push Changes
        run: |
          git add README.md
          git commit -m "Update README with latest blog posts" || echo "No changes to commit"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.PAT_TOKEN }}  # GitHub 인증을 위한 토큰 사용
