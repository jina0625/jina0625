name: Update README with Tistory RSS

on:
  schedule:
    - cron: '0 15 * * *'  # 한국 시간 기준 매일 00:00 (UTC 15:00)
  workflow_dispatch:  # 필요시 수동 실행 가능

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@v3

      - name: Python 환경 설정
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'  # 최신 Python 버전 사용

      - name: RSS 피드 업데이트 실행
        run: |
          pip install feedparser
          python fetch_rss.py

      - name: 변경 사항 확인 및 커밋
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "🔄 Update README with latest blog posts" && git push)
