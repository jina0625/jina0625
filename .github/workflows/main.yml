name: README Updater

on:
  push:
    branches: [ main ]
  schedule:
    - cron: "0 0 * * *"  # 매일 자정 (UTC 기준)

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v3
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          pip install feedparser

      - name: Run update script
        run: python main.py

      - name: Commit and push changes
        run: |
          git config --local user.email "155883395+jina0625@users.noreply.github.com"
          git config --local user.name "jina0625"
          git add README.md
          git diff --quiet || (
            COMMIT_DATE=$(date +'%Y-%m-%d')
            git commit -m "Update README on $COMMIT_DATE"
            git push
          )
