name: README Updater

on:
  push:
    branches: [ main ]  # GitHub 기본 브랜치 설정 (master → main)
  pull_request:
    branches: [ main ]
  schedule:
    - cron: "0 9 * * *"  # 매일 오전 9시 (UTC 기준)

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python 3.9
      uses: actions/setup-python@v3
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install feedparser

    - name: Update README
      run: |
        python main.py  # README 업데이트를 수행하는 main.py 실행

    - name: Commit README
      run: |
        git add README.md
        git diff --quiet
