name: README Updater

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: "0 0 * * *"  # 매일 자정 (UTC) → 한국 시간 오전 9시

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python 3.9
      uses: actions/setup-python@v3
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install feedparser

    - name: Update README
      run: |
        python main.py

    - name: Commit & Push changes
      run: |
        git config --local user.email "wlsdk6395@naver.com"
        git config --local user.name "jina0625"
        git add README.md
        git diff --quiet || (git commit -m "Update README.md from Tistory RSS" && git push)
