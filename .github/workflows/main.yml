name: Tistory Blog Updater

on:
  workflow_dispatch:       # 수동 실행 가능
  schedule:
    - cron: "0 0 * * *"    # 매일 자정 실행 (UTC 기준)

permissions:
  contents: write          # push 권한을 위한 설정

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Install feedparser
        run: pip install feedparser

      - name: Run blog updater script
        run: |
          python main.py

      - name: Commit and push if README changed
        env:
          TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }} 
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "actions@github.com"

          if git diff --quiet README.md; then
            echo "No changes to commit"
          else
            git add README.md
            git commit -m "Update README with latest blog posts"
            git push https://x-access-token:${TOKEN}@github.com/${{ github.repository }} HEAD:main
          fi
